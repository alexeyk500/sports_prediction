services:
  postgres:
    image: postgres:17-alpine
    container_name: sports_prediction_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sports_prediction
      POSTGRES_PASSWORD: sports_prediction_dev_password
      POSTGRES_DB: sports_prediction
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sports_prediction_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_prediction -d sports_prediction"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  sports_prediction_postgres_data:
